<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Local Chatbot Test</title><style>body{font:16px system-ui;background:#eef2f7;color:#162338;margin:0;padding:35px;max-width:780px}main{padding:30px;background:white;border-radius:16px}textarea{width:100%;padding:12px;height:90px;box-sizing:border-box}button{margin:14px 0;padding:12px 25px;background:#225ed6;color:white;border:0;border-radius:8px}.assistant-response{min-height:95px;padding:20px;background:#e4edff;white-space:pre-wrap;border-radius:10px}</style></head><body><main><h1>Local Bot Demo — Safe Test</h1><p>Halaman lokal yang mensimulasikan respons chatbot streaming dan perubahan DOM.</p><label for="prompt">Prompt</label><textarea id="prompt" placeholder="Ketik pesan di sini"></textarea><button id="send" type="button">Kirim</button><h2>Respons chatbot</h2><div class="assistant-response"></div><p id="state">Siap</p></main><script>const $=s=>document.querySelector(s);$('#send').onclick=()=>{let p=$('#prompt').value.trim();if(!p)return;let out=$('.assistant-response');let response='Ini adalah jawaban simulasi untuk: '+p+'\nRespon diperbarui bertahap melalui JavaScript di halaman.';out.textContent='';$('#state').textContent='Streaming';let i=0;const t=setInterval(()=>{i=Math.min(i+3,response.length);out.textContent=response.slice(0,i);if(i===response.length){clearInterval(t);$('#state').textContent='Selesai'}},75)};</script></body></html>
